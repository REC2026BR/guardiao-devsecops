name: Guardiao DevSecOps - analise

on:
  workflow_call:
    inputs:
      languages:
        description: "Array JSON de linguagens CodeQL"
        required: false
        type: string
        default: '["javascript"]'
      run_dependency_review:
        description: "Executa revisao de dependencias em Pull Requests"
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  secrets:
    name: Secret Agent
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: Code Agent
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(inputs.languages) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v4

  dependencies:
    name: Dependency Agent
    if: ${{ inputs.run_dependency_review && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
